# Asks each pull request's author to sign the Contributor License Agreement (CLA.md) and records the
# signatures in signatures/cla.json on the cla-signatures branch (docs/licensing.md, "Setting up
# the CLA bot"). The action runs from pull_request_target so it can comment on pull requests from
# forks; it never checks out or runs their code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check the CLA
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # contributor-assistant/github-action v2.6.1, pinned to its commit.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: ${{ github.repository_owner }},dependabot[bot]
